# Auteurs du blog — multilingue FR/EN
# Ce fichier est copie dans `data/authors.yaml` a la racine du site Hugo a la creation du site.
# Hugo le lit nativement via `.Site.Data.authors` dans les templates.
#
# Structure : map d'auteurs indexee par ID (slug)
# L'ID est utilise dans le frontmatter des articles comme `author: thomas-durand`
#
# Le champ `topics` sert a la selection automatique de l'auteur dans /create-article-geo.
# Le champ `expertise` alimente le schema.org Person -> knowsAbout.

claire-vasseur:
  id: claire-vasseur
  name: Claire Vasseur
  type: person
  avatar: ""
  linkedinUrl: ""
  jobTitle:
    fr: Consultante en gestion des services
    en: Service management consultant
  role:
    fr: Consultante en gestion des services
    en: Service management consultant
  bio:
    fr: "Claire Vasseur accompagne des directions informatiques et des fonctions support dans la structuration de leurs services : catalogues, niveaux d'engagement, organisation du support et gestion de parc. Elle écrit sur ESM Guide pour rendre ces sujets lisibles en dehors du cercle des spécialistes."
    en: "Claire Vasseur works with IT departments and support functions on structuring their services: catalogues, service levels, support organisation and asset management. She writes for ESM Guide to make these topics readable outside the circle of specialists."
  expertise:
    - Enterprise Service Management
    - ITSM
    - ITIL
    - Service desk
