# ESM Guide — configuration Hugo
# Provisoire : le site est servi sur l'URL GitHub en attendant que le domaine
# esm-guide.com soit branche. Pour rebasculer : remettre https://esm-guide.com/,
# recreer static/CNAME avec "esm-guide.com", puis redeployer.
baseURL = "https://analytics-ds.github.io/esm-guide/"
title = "ESM Guide"
theme = "esm-guide"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableEmoji = false
summaryLength = 30

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["html", "rss", "llms"]

[pagination]
  pagerSize = 12

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    noClasses = false

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[params]
  default_og_image = "/images/og-default.jpg"
  logo = "/favicon.svg"
  founding_year = "2026"
  og_locale_alternate = "en_US"
  expertise = ["Enterprise Service Management", "ITSM", "ITIL", "Service desk", "Gestion de parc informatique", "ITAM", "CMDB"]

# ---------------------------------------------------------------- LANGUES

[languages]
  [languages.fr]
    contentDir = "content/fr"
    locale = "fr-FR"
    label = "Français"
    weight = 1
    title = "Guide ESM"
    [languages.fr.params]
      description = "Le média indépendant de l'Enterprise Service Management : ITSM, service desk, gestion de parc et comparatifs d'outils."

  [languages.en]
    contentDir = "content/en"
    locale = "en-US"
    label = "English"
    weight = 2
    title = "ESM Guide"
    [languages.en.params]
      description = "The independent Enterprise Service Management media: ITSM, service desk, IT asset management and tool comparisons."

